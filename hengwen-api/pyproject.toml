[project]
name = "hengwen-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ChaoDaiShi", email = "16873735+chaodaishi@user.noreply.gitee.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0",
    "fastapi[standard]>=0.141.1",
    "lxml>=6.1.1",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pymysql>=1.2.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
hengwen-api = "hengwen_api:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]
